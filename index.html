<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Tải ảnh lên</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #111827; color: #f9fafb; }
    main { width: 100%; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 18px; padding: 26px; text-align: center; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }
    main:active { background: #1f2937; }
    .symbol { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 24px; background: #263347; border: 1px solid #405169; }
    .symbol svg { width: 40px; height: 40px; stroke: #93c5fd; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: clamp(23px, 5vw, 30px); margin: 0; font-weight: 720; letter-spacing: -.02em; }
    p { margin: 0; font-size: 15px; line-height: 1.5; color: #cbd5e1; }
    #status { max-width: 480px; min-height: 24px; overflow-wrap: anywhere; font-weight: 600; }
    #status.error { color: #fca5a5; }
    #status.success { color: #86efac; }
    #photoInput { display: none; }
    main[aria-busy="true"] { cursor: progress; opacity: .83; }
  </style>
</head>
<body>
  <main id="area" role="button" tabindex="0" aria-label="Nhấn vào bất cứ đâu để chọn ảnh tải lên" aria-busy="false">
    <div class="symbol" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 16V3m0 0L7 8m5-5 5 5"/><path d="M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
    </div>
    <h1>Chạm bất kỳ đâu để tải ảnh</h1>
    <p>Chọn một ảnh trên điện thoại hoặc máy tính.</p>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <input id="photoInput" type="file" accept="image/*">
  <script>
    // THAY DUONG DAN BEN DUOI BANG URL WORKER CUA BAN.
    const WORKER_URL = "https://anh-gan-nhat-api.ttthdndt.workers.dev";
    const STORAGE_KEY = "github-photo-upload-passcode";
    const area = document.getElementById("area");
    const picker = document.getElementById("photoInput");
    const status = document.getElementById("status");
    let busy = false;

    function show(message, type = "") {
      status.textContent = message;
      status.className = type;
    }
    function getSavedKey() {
      try { return localStorage.getItem(STORAGE_KEY) || ""; } catch { return ""; }
    }
    function saveKey(key) {
      try { if (key) localStorage.setItem(STORAGE_KEY, key); else localStorage.removeItem(STORAGE_KEY); } catch {}
    }
    function pick() {
      if (busy) return;
      if (WORKER_URL.includes("YOUR-WORKER")) {
        show("Chưa cấu hình địa chỉ Worker trong index.html.", "error");
        return;
      }
      picker.click();
    }
    area.addEventListener("click", pick);
    area.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); }
    });

    async function sendPhoto(file, key) {
      const form = new FormData();
      form.append("image", file, file.name);
      const headers = key ? { "X-Upload-Key": key } : {};
      const response = await fetch(WORKER_URL.replace(/\/$/, "") + "/upload", {
        method: "POST", headers, body: form
      });
      const body = await response.json().catch(() => ({}));
      return { ok: response.ok, status: response.status, body };
    }

    async function diagnoseConnection() {
      let base;
      try {
        const url = new URL(WORKER_URL);
        if (url.protocol !== "https:" || !url.hostname) throw new Error("invalid");
        base = WORKER_URL.replace(/\/$/, "");
      } catch {
        return "URL Worker không hợp lệ. Kiểm tra dòng WORKER_URL trong index.html.";
      }
      if (location.protocol === "file:") {
        return "Bạn đang mở file trực tiếp. Hãy dùng đường dẫn GitHub Pages (https://...).";
      }
      try {
        const response = await fetch(base + "/health", { cache: "no-store" });
        const data = await response.json();
        if (!response.ok || data.service !== "github-photo-uploader") {
          return "Worker chưa chạy đúng phiên bản. Hãy thay worker.js bằng bản mới rồi Deploy.";
        }
        if (!data.allowed_origin || data.allowed_origin !== location.origin) {
          return `Sai ALLOWED_ORIGIN: Cloudflare đang đặt '${data.allowed_origin || "(trống)"}', cần đặt '${location.origin}'.`;
        }
        if (!data.github_configured) {
          return "Worker chưa có đủ GITHUB_TOKEN, GITHUB_OWNER hoặc GITHUB_REPO.";
        }
        return "Worker hoạt động nhưng yêu cầu tải ảnh bị chặn. Kiểm tra tab Network/Console hoặc Deploy lại Worker.";
      } catch {
        return "Không truy cập được Worker hoặc /health bị chặn. Kiểm tra URL Worker, Deploy và thử mở URL Worker + /health.";
      }
    }

    picker.addEventListener("change", async () => {
      const file = picker.files?.[0];
      picker.value = ""; // Cho phep chon lai chinh anh vua chon.
      if (!file || busy) return;
      if (!file.type.startsWith("image/")) { show("Vui lòng chọn tệp ảnh.", "error"); return; }
      if (file.size > 8 * 1024 * 1024) { show("Ảnh vượt quá 8 MB.", "error"); return; }
      busy = true;
      area.setAttribute("aria-busy", "true");
      show("Đang tải ảnh lên…");
      try {
        let key = getSavedKey();
        let result = await sendPhoto(file, key);
        if (result.status === 401) {
          key = window.prompt("Nhập mã tải ảnh (chỉ cần nhập lần đầu trên trình duyệt này):", "") || "";
          if (!key) { show("Đã hủy. Chạm để chọn lại ảnh."); return; }
          result = await sendPhoto(file, key);
          if (result.ok) saveKey(key);
          else if (result.status === 401) saveKey("");
        }
        if (!result.ok) throw new Error(result.body.error || `Không tải được ảnh (HTTP ${result.status}).`);
        show("✓ Đã lưu ảnh vào thư mục uploads!", "success");
      } catch (error) {
        if (error instanceof TypeError) {
          show("Đang kiểm tra kết nối Worker...");
          show(await diagnoseConnection(), "error");
        } else {
          show(error.message || "Đã xảy ra lỗi.", "error");
        }
      } finally {
        busy = false;
        area.setAttribute("aria-busy", "false");
      }
    });
  </script>
</body>
</html>
